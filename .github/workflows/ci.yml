name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BlogApp.sln
      - name: Build
        run: dotnet build BlogApp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BlogApp.sln --configuration Release --no-build
